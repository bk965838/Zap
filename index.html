<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TV en direct, simple et épurée.">
<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zap">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#fafafa;--fg:#111114;--mut:#6b6b76;--card:#fff;--line:#e7e7ec;--acc:#5b5bf0;--acc-fg:#fff;--shadow:0 1px 2px rgba(0,0,0,.04);
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0f;--fg:#f2f2f5;--mut:#8d8d99;--card:#15151b;--line:#24242c;--acc:#8a8aff;--acc-fg:#0b0b0f;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- En-tête ---------- */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px);border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 12px 0 36px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mut)}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px;gap:2px}
.seg button{height:32px;min-width:40px;padding:0 10px;border-radius:8px;font-size:15px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
@media (max-width:480px){.brand span{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 12px;max-width:1400px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---------- Grille ---------- */
main{padding:8px calc(var(--sar) + 16px) calc(var(--sab) + 40px) calc(var(--sal) + 16px);max-width:1400px;margin:0 auto}
.count{color:var(--mut);font-size:13px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.tile{aspect-ratio:16/10;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.card:hover .tile{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.card:active .tile{transform:scale(.98)}
.tile img{width:64%;height:64%;object-fit:contain}
.tile .ini{font-weight:700;font-size:22px;color:var(--mut);letter-spacing:.02em}
.tile .fav{position:absolute;top:6px;right:8px;color:var(--acc);font-size:13px}
.name{font-size:13px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--mut);font-size:12px;margin-top:-4px}
.empty{color:var(--mut);text-align:center;padding:80px 20px}
.empty button{margin-top:14px;height:36px;padding:0 16px;border-radius:10px;background:var(--fg);color:var(--bg)}
.foot{margin-top:36px;color:var(--mut);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.foot button{text-decoration:underline;text-underline-offset:3px;color:var(--mut)}
.hint{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut);display:flex;gap:10px;align-items:center;justify-content:space-between}
.hint button{color:var(--fg);font-weight:600}

/* ---------- Lecteur ---------- */
#player{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;color:#fff}
#player[hidden]{display:none}
.pbar{display:flex;align-items:center;gap:4px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 8px calc(var(--sal) + 10px);background:#000}
.pbar button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.pbar button:hover{background:rgba(255,255,255,.12)}
.pbar button[disabled]{opacity:.3;pointer-events:none}
.ptitle{flex:1;min-width:0;padding:0 6px}
.ptitle b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{display:block;font-size:12px;color:#9a9aa6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pCC{font-weight:700;font-size:13px;letter-spacing:.02em;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;width:36px;height:26px;margin:0 6px}
#pCC.on{background:#fff;color:#000;border-color:#fff}
.pstage{flex:1;position:relative;min-height:0;display:grid;place-items:center;padding:0 0 var(--sab)}
.pstage video{width:100%;height:100%;background:#000;object-fit:contain}
#pMsg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px;pointer-events:none;color:#cfcfd8}
#pMsg[hidden]{display:none}
#pMsg button{pointer-events:auto;height:38px;padding:0 18px;border-radius:10px;background:#fff;color:#000;font-weight:600}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ccMenu,#moreMenu{position:absolute;top:6px;right:calc(var(--sar) + 10px);width:min(300px,calc(100% - 20px));background:rgba(28,28,34,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;z-index:3;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#ccMenu[hidden],#moreMenu[hidden]{display:none}
#ccMenu h4,#moreMenu h4{margin:8px 10px 4px;font-size:12px;font-weight:500;color:#9a9aa6;text-transform:uppercase;letter-spacing:.06em}
#ccMenu button,#moreMenu button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:42px;padding:0 10px;border-radius:9px;text-align:left;color:#fff;font-size:15px;gap:10px}
#ccMenu button:hover,#moreMenu button:hover{background:rgba(255,255,255,.1)}
#ccMenu button .ck,#moreMenu button .ck{color:#8a8aff;font-weight:700}
#ccMenu p,#moreMenu p{margin:6px 10px 10px;font-size:13px;color:#9a9aa6}
#ccMenu hr,#moreMenu hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:6px 0}
#v.off{display:none}
#a{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 6px);width:calc(100% - 24px);margin:0 12px;max-width:560px;justify-self:center;z-index:2}
#a[hidden]{display:none}
#aView{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px 24px 90px;color:#cfcfd8;pointer-events:none}
#aView[hidden]{display:none}
#aView .lg{width:132px;height:132px;border-radius:28px;background:#15151b;border:1px solid #24242c;display:grid;place-items:center;overflow:hidden}
#aView .lg img{width:70%;height:70%;object-fit:contain}
#aView .lg span{font-size:36px;font-weight:700;color:#8d8d99}
#aView b{font-size:18px;color:#fff}
#aView small{font-size:13px;color:#9a9aa6}
@media (max-width:420px){.pbar button{width:36px}.pbar{gap:2px}}
video::cue{font-size:1.1em;background:rgba(0,0,0,.72);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.load{display:grid;place-items:center;gap:14px;padding:100px 20px;color:var(--mut);text-align:center}
.load .spin{border-color:var(--line);border-top-color:var(--acc)}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
  .brand{font-size:22px}
}
</style>
</head>
<body>
<header id="hd">
  <div class="top">
    <div class="brand"><i></i><span>Zap</span></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher une chaîne" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Rechercher une chaîne">
    </label>
    <div class="seg" id="seg" role="group" aria-label="Pays">
      <button data-c="all" aria-pressed="true">Tout</button>
      <button data-c="fr" aria-pressed="false" aria-label="France">🇫🇷</button>
      <button data-c="us" aria-pressed="false" aria-label="États-Unis">🇺🇸</button>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Catégories"></nav>
</header>

<main id="main">
  <div id="hintBox"></div>
  <div id="count" class="count"></div>
  <div id="grid" class="grid"></div>
  <div id="sentinel" style="height:1px"></div>
  <div id="state"></div>
  <div class="foot" id="foot" hidden>
    <button id="reload">Actualiser la liste</button>
    <button id="unhide">Réafficher les chaînes masquées</button>
    <button id="addList">Ajouter une playlist</button>
    <button id="delLists" hidden>Retirer mes playlists</button>
  </div>
</main>

<section id="player" hidden aria-label="Lecteur">
  <div class="pbar">
    <button id="pBack" aria-label="Fermer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="ptitle"><b id="pName"></b><span id="pMeta"></span></div>
    <button id="pPrev" aria-label="Chaîne précédente"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="pNext" aria-label="Chaîne suivante"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
    <button id="pFav" aria-label="Favori"></button>
    <button id="pCC" aria-label="Sous-titres" aria-haspopup="true">CC</button>
    <button id="pMore" aria-label="Plus d’options" aria-haspopup="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>
  <div class="pstage">
    <video id="v" controls playsinline webkit-playsinline x-webkit-airplay="allow"></video>
    <audio id="a" controls playsinline x-webkit-airplay="allow" hidden></audio>
    <div id="aView" hidden></div>
    <div id="pMsg" hidden></div>
    <div id="ccMenu" hidden></div>
    <div id="moreMenu" class="menu" hidden></div>
  </div>
</section>
<input type="file" id="subFile" accept=".srt,.vtt,text/vtt,application/x-subrip" hidden>
<div class="toast" id="toast" hidden></div>

<script src="lib.js"></script>
<script>
'use strict';
const PLAYLIST = 'https://iptv-org.github.io/iptv/index.m3u';
const HLS_CDN = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
const $ = s => document.querySelector(s);
const { norm, CAT_FR, parseM3U, addEntries, finalize } = ZapLib;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


/* ---------- stockage ---------- */
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const favs = new Set(ls.get('zap.favs', []));
// Chaînes en échec : masquées 7 jours, puis réessayées automatiquement
const bad  = new Map(Object.entries(ls.get('zap.bad2', {})).filter(([, t]) => Date.now() - t < 6048e5));
const saveBad = () => ls.set('zap.bad2', Object.fromEntries(bad));
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('zap', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function kvGet(k) { try { const d = await idb(); return await new Promise(r => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch { return null; } }
async function kvSet(k, v) { try { const d = await idb(); await new Promise(r => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = r; t.onerror = r; }); } catch {} }

/* ---------- données ---------- */
const recent = ls.get('zap.recent', []);
function pushRecent(id) { const i = recent.indexOf(id); if (i >= 0) recent.splice(i, 1); recent.unshift(id); recent.length = Math.min(recent.length, 24); ls.set('zap.recent', recent); }
const saved = ls.get('zap.view', {});
const state = { data: null, cat: saved.cat || 'all', country: saved.country || 'all', q: '', shown: 0 };
const saveView = () => ls.set('zap.view', { cat: state.cat, country: state.country });
const byId = new Map();
const PAGE = 72;

async function fetchText(u) { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ' ' + r.status); return r.text(); }

async function buildData() {
  const map = new Map();
  let verified = false;
  // 1) Liste déjà contrôlée (générée chaque nuit sur GitHub) : plus rapide, sans chaînes mortes
  try {
    const r = await fetch('channels.json', { cache: 'no-cache' });
    if (r.ok) {
      const b = await r.json();
      for (const c of b.ch || []) map.set(c.id, { ...c, q: c.u.map(() => 0) });
      verified = map.size > 0;
    }
  } catch (e) {}
  // 2) Sinon : playlist iptv-org lue directement, plus votre fichier extra.m3u
  if (!verified) {
    addEntries(map, parseM3U(await fetchText(PLAYLIST)), false);
    try { addEntries(map, parseM3U(await fetchText('extra.m3u')), true); } catch (e) {}
  }
  for (const u of ls.get('zap.lists', [])) {
    try { addEntries(map, parseM3U(await fetchText(u)), true); } catch (e) { /* playlist perso injoignable */ }
  }
  return finalize(map);
}

function setData(d) {
  state.data = d;
  const cn = new Map(d.countries.map(c => [c.code, c]));
  d.cn = cn;
  byId.clear();
  for (const c of d.ch) { c._s = norm(c.n + ' ' + (cn.get(c.c)?.name || '') + ' ' + c.k.map(k => CAT_FR[k] || k).join(' ')); byId.set(c.id, c); }
  if (!['all', 'fav', 'recent', 'football', ...d.cats.map(c => c.id)].includes(state.cat)) state.cat = 'all';
  renderChips();
  syncSeg();
  render();
}

async function load(force) {
  if (!force) {
    const cached = await kvGet('data3');
    if (cached?.ch?.length) {
      setData(cached);
      if (Date.now() - cached.t > 216e5) refreshQuiet();
      return;
    }
  }
  showLoading('Chargement des chaînes… (la première fois, cela peut prendre quelques secondes)');
  try {
    const d = await buildData();
    await kvSet('data3', d);
    setData(d);
  } catch (e) {
    showError('Impossible de charger la liste. Vérifiez votre connexion.');
  }
}
async function refreshQuiet() { try { const d = await buildData(); await kvSet('data3', d); setData(d); } catch {} }

/* ---------- interface liste ---------- */
function showLoading(t) { $('#grid').innerHTML = ''; $('#count').textContent = ''; $('#foot').hidden = true; $('#state').innerHTML = `<div class="load"><div class="spin"></div><div>${esc(t)}</div></div>`; }
function showError(t) { $('#state').innerHTML = `<div class="empty">${esc(t)}<br><button id="retry">Réessayer</button></div>`; $('#retry').onclick = () => load(true); }

function renderChips() {
  const d = state.data;
  const items = [['all', 'Tout'], ['fav', 'Favoris'], ['recent', 'Récents'], ['football', '⚽ Football'], ...d.cats.map(c => [c.id, c.name])];
  $('#chips').innerHTML = items.map(([id, n]) => `<button class="chip" data-cat="${esc(id)}" aria-pressed="${id === state.cat}">${esc(n)}</button>`).join('');
}

let list = [];
function filtered() {
  const q = norm(state.q.trim());
  const out = state.data.ch.filter(c =>
    !bad.has(c.id) &&
    (state.cat === 'all' || (state.cat === 'fav' ? favs.has(c.id) : state.cat === 'recent' ? recent.includes(c.id) : state.cat === 'football' ? c.fb : c.k.includes(state.cat))) &&
    (state.country === 'all' || c.g === state.country) &&
    (!q || c._s.includes(q)));
  if (state.cat === 'recent') out.sort((a, b) => recent.indexOf(a.id) - recent.indexOf(b.id));
  return out;
}
function cardHTML(c) {
  const co = state.data.cn.get(c.c);
  const ini = esc(c.n.replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase());
  const img = c.l ? `<img src="${esc(c.l)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ini',textContent:'${ini}'}))">` : `<span class="ini">${ini}</span>`;
  return `<button class="card" data-id="${esc(c.id)}"><div class="tile">${img}${favs.has(c.id) ? '<span class="fav">★</span>' : ''}</div><div class="name">${esc(c.n)}</div>${co ? `<div class="sub">${esc((co.flag ? co.flag + ' ' : '') + co.name)}</div>` : ''}</button>`;
}
function render() {
  list = filtered();
  state.shown = 0;
  $('#grid').innerHTML = '';
  $('#state').innerHTML = '';
  $('#foot').hidden = false;
  $('#count').textContent = list.length ? `${list.length.toLocaleString('fr-FR')} chaîne${list.length > 1 ? 's' : ''}` : '';
  if (!list.length) {
    $('#state').innerHTML = `<div class="empty">${!state.q && state.cat === 'fav' ? 'Aucun favori pour le moment.<br>Ouvrez une chaîne et touchez l’étoile.' : !state.q && state.cat === 'recent' ? 'Aucune chaîne regardée récemment.' : 'Aucune chaîne trouvée.'}</div>`;
    return;
  }
  more();
}
function more() {
  if (state.shown >= list.length) return;
  const next = list.slice(state.shown, state.shown + PAGE);
  state.shown += next.length;
  $('#grid').insertAdjacentHTML('beforeend', next.map(cardHTML).join(''));
}
new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && state.data) more(); }, { rootMargin: '600px' }).observe($('#sentinel'));

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.cat = b.dataset.cat; saveView();
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  window.scrollTo({ top: 0 });
  render();
});
function syncSeg() { document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === state.country)); }
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.country = b.dataset.c; saveView(); syncSeg(); window.scrollTo({ top: 0 }); if (state.data) render();
});
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#grid').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) openPlayer(b.dataset.id); });
window.addEventListener('scroll', () => $('#hd').classList.toggle('scrolled', scrollY > 4), { passive: true });
$('#reload').onclick = () => load(true);
const syncLists = () => { $('#delLists').hidden = !ls.get('zap.lists', []).length; };
$('#addList').onclick = () => {
  const u = (prompt('Adresse d’une playlist .m3u (http://… ou https://…)\nElle sera ajoutée à la liste, par exemple pour plus de football.') || '').trim();
  if (!u) return;
  if (!/^https?:\/\//i.test(u)) { toast('L’adresse doit commencer par http:// ou https://'); return; }
  const l = ls.get('zap.lists', []); if (!l.includes(u)) l.push(u);
  ls.set('zap.lists', l); syncLists(); toast('Playlist ajoutée, mise à jour…'); load(true);
};
$('#delLists').onclick = () => { ls.set('zap.lists', []); syncLists(); toast('Playlists retirées'); load(true); };
syncLists();
$('#unhide').onclick = () => { bad.clear(); saveBad(); toast('Chaînes réaffichées'); if (state.data) render(); };

/* ---------- lecteur ---------- */
const video = $('#v');
let hls = null, cur = null, snap = [], si = 0, tok = 0, watchdog = 0, ext = [];
const native = !!video.canPlayType('application/vnd.apple.mpegurl');

const starSVG = on => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;

function openPlayer(id) {
  const c = byId.get(id); if (!c) return;
  snap = list.length ? list : filtered();
  if (!snap.includes(c)) snap = [c];
  const wasHidden = $('#player').hidden;
  $('#player').hidden = false;
  document.body.style.overflow = 'hidden';
  if (wasHidden) history.pushState({ p: 1 }, '');
  startChannel(c);
}
function closePlayer(fromPop) {
  if ($('#player').hidden) return;
  stop();
  $('#player').hidden = true;
  $('#ccMenu').hidden = true; $('#moreMenu').hidden = true;
  document.body.style.overflow = '';
  if (!fromPop && history.state?.p) history.back();
  if (state.cat === 'fav' || state.cat === 'recent') render();
}
window.addEventListener('popstate', () => closePlayer(true));

function startChannel(c) {
  cur = c; si = 0; pushRecent(c.id);
  const co = state.data.cn.get(c.c);
  $('#pName').textContent = c.n;
  $('#pMeta').textContent = [co && co.name, c.k.map(k => CAT_FR[k] || k).slice(0, 2).join(' · ')].filter(Boolean).join(' — ');
  $('#pFav').innerHTML = starSVG(favs.has(c.id));
  const i = snap.indexOf(c);
  $('#pPrev').disabled = i <= 0;
  $('#pNext').disabled = i < 0 || i >= snap.length - 1;
  clearExt();
  setSession(c);
  renderAudioView();
  playUrl(c.u[0]);
}
function setPlaybackState(s) { try { navigator.mediaSession.playbackState = s; } catch (e) {} }
function setSession(c) {
  if (!('mediaSession' in navigator)) return;
  try {
    const fallback = new URL('icons/icon-512.png', location.href).href;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: c.n, artist: 'Zap',
      artwork: [...(c.l ? [{ src: c.l, sizes: '512x512' }] : []), { src: fallback, sizes: '512x512', type: 'image/png' }]
    });
    const h = (act, fn) => { try { navigator.mediaSession.setActionHandler(act, fn); } catch (e) {} };
    h('play', () => { media().play().catch(() => {}); setPlaybackState('playing'); });
    h('pause', () => { media().pause(); setPlaybackState('paused'); });
    h('stop', () => closePlayer());
    h('nexttrack', () => step(1));
    h('previoustrack', () => step(-1));
  } catch (e) {}
}
function stop() {
  tok++; clearTimeout(watchdog);
  if (hls) { try { hls.destroy(); } catch {} hls = null; }
  clearMedia(video); clearMedia(audioEl);
  clearExt();
}
function msg(html) { const m = $('#pMsg'); m.hidden = !html; m.innerHTML = html || ''; }
function ensureHls() {
  if (window.Hls) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = HLS_CDN; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
let audioMode = false, curUrl = '';
const audioEl = $('#a');
const media = () => audioMode ? audioEl : video;
function clearMedia(el) { try { el.pause(); el.removeAttribute('src'); el.load(); } catch (e) {} }
async function playUrl(url) {
  const my = ++tok; clearTimeout(watchdog); curUrl = url;
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  const m = media(); clearMedia(audioMode ? video : audioEl);
  msg('<div class="spin"></div>');
  watchdog = setTimeout(() => { if (my === tok) fail(my); }, 20000);
  const ok = () => { if (my !== tok) return; clearTimeout(watchdog); msg(''); setPlaybackState('playing'); };
  video.onplaying = audioEl.onplaying = null;
  m.onplaying = ok;
  if (native) {
    m.onerror = () => fail(my);
    m.src = url;
    m.play().catch(() => {});
  } else {
    try { await ensureHls(); } catch (e) { if (my === tok) { msg('<div>Lecteur indisponible hors connexion.</div>'); } return; }
    if (my !== tok) return;
    if (!Hls.isSupported()) { fail(my); return; }
    hls = new Hls({ maxBufferLength: 30, enableWorker: true, subtitleDisplay: false });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal && my === tok) fail(my); });
    hls.loadSource(url);
    hls.attachMedia(m);
    m.play().catch(() => {});
  }
}
function fail(my) {
  if (my !== tok) return;
  clearTimeout(watchdog);
  if (cur && si + 1 < cur.u.length) { si++; playUrl(cur.u[si]); return; }
  // Aucun flux ne répond (hors ligne, géo-bloqué, supprimé…) : on masque la chaîne pour la prochaine fois.
  if (cur) { bad.set(cur.id, Date.now()); saveBad(); }
  const i = snap.indexOf(cur);
  const hasNext = i >= 0 && i < snap.length - 1;
  msg(`<div><b>Cette chaîne n’est pas disponible.</b><br>Elle est peut-être hors ligne ou réservée à d’autres pays.<br>Elle sera masquée de la liste.</div>${hasNext ? '<button id="skip">Chaîne suivante</button>' : ''}`);
  const sk = $('#skip'); if (sk) sk.onclick = () => step(1);
}
function step(d) {
  const i = snap.indexOf(cur), n = snap[i + d];
  if (n) startChannel(n);
}
$('#pBack').onclick = () => closePlayer();
$('#pPrev').onclick = () => step(-1);
$('#pNext').onclick = () => step(1);
$('#pFav').onclick = () => {
  if (!cur) return;
  favs.has(cur.id) ? favs.delete(cur.id) : favs.add(cur.id);
  ls.set('zap.favs', [...favs]);
  $('#pFav').innerHTML = starSVG(favs.has(cur.id));
  toast(favs.has(cur.id) ? 'Ajoutée aux favoris' : 'Retirée des favoris');
};

/* ---------- sous-titres ---------- */
function clearExt() { for (const e of ext) { try { e.el.remove(); URL.revokeObjectURL(e.url); } catch {} } ext = []; $('#pCC').classList.remove('on'); }
function streamTracks() {
  // Pistes de sous-titres présentes dans le flux lui-même
  if (hls) return (hls.subtitleTracks || []).map((t, i) => ({ label: t.name || t.lang || 'Piste ' + (i + 1), on: hls.subtitleDisplay && hls.subtitleTrack === i, pick() { hls.subtitleTrack = i; hls.subtitleDisplay = true; } }));
  return [...video.textTracks].filter(t => (t.kind === 'subtitles' || t.kind === 'captions') && !ext.some(e => e.el.track === t))
    .map((t, i) => ({ label: t.label || t.language || 'Piste ' + (i + 1), on: t.mode === 'showing', pick() { t.mode = 'showing'; } }));
}
function allOff() {
  if (hls) hls.subtitleDisplay = false;
  for (const t of video.textTracks) if (t.kind === 'subtitles' || t.kind === 'captions') t.mode = 'disabled';
}
function updateCCBadge() { setTimeout(() => { const on = [...video.textTracks].some(t => t.mode === 'showing') || (hls && hls.subtitleDisplay); $('#pCC').classList.toggle('on', !!on); }, 50); }
function openCC() {
  const m = $('#ccMenu');
  if (!m.hidden) { m.hidden = true; return; }
  const s = streamTracks();
  const e = ext.map(x => ({ label: x.label, on: x.el.track.mode === 'showing', pick() { x.el.track.mode = 'showing'; } }));
  const rows = [...s, ...e];
  const none = !rows.some(r => r.on);
  let h = `<button data-i="off"><span>Désactivés</span>${none ? '<span class="ck">✓</span>' : ''}</button>`;
  if (s.length) h += '<h4>Dans le flux</h4>' + s.map((r, i) => `<button data-i="s${i}"><span>${esc(r.label)}</span>${r.on ? '<span class="ck">✓</span>' : ''}</button>`).join('');
  if (e.length) h += '<h4>Fichiers ajoutés</h4>' + e.map((r, i) => `<button data-i="e${i}"><span>${esc(r.label)}</span>${r.on ? '<span class="ck">✓</span>' : ''}</button>`).join('');
  if (!s.length) h += '<p>Cette chaîne ne propose pas de sous-titres dans son flux.</p>';
  h += '<hr><button data-i="file"><span>Ajouter un fichier (.srt, .vtt)…</span></button>';
  m.innerHTML = h; m.hidden = false;
  m.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const k = b.dataset.i;
    if (k === 'file') { $('#subFile').click(); m.hidden = true; return; }
    allOff();
    if (k[0] === 's') s[+k.slice(1)].pick();
    else if (k[0] === 'e') e[+k.slice(1)].pick();
    m.hidden = true; updateCCBadge();
  };
}
$('#pCC').onclick = e => { e.stopPropagation(); openCC(); };
document.addEventListener('click', e => { const m = $('#ccMenu'); if (!m.hidden && !m.contains(e.target)) m.hidden = true; });

function srt2vtt(t) {
  t = t.replace(/^﻿/, '').replace(/\r\n?/g, '\n').trim();
  if (/^WEBVTT/.test(t)) return t;
  return 'WEBVTT\n\n' + t.replace(/(\d{1,2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2').replace(/^\d+\n(?=\d{1,2}:\d{2}:\d{2}\.\d{3} -->)/gm, '');
}
$('#subFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const buf = await f.arrayBuffer();
    let txt = new TextDecoder('utf-8').decode(buf);
    if (txt.includes('�')) txt = new TextDecoder('windows-1252').decode(buf); // fichiers SRT anciens (accents)
    const vtt = srt2vtt(txt);
    if (!/-->/.test(vtt)) throw 0;
    const url = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
    const el = document.createElement('track');
    el.kind = 'subtitles'; el.label = f.name.replace(/\.(srt|vtt)$/i, ''); el.srclang = 'fr'; el.src = url;
    video.appendChild(el);
    allOff();
    ext.push({ el, url, label: el.label });
    el.track.mode = 'showing';
    updateCCBadge();
    toast('Sous-titres activés');
  } catch { toast('Fichier de sous-titres illisible'); }
});

/* ---------- mode audio (arrière-plan) et image dans l'image ---------- */
function renderAudioView() {
  const v = $('#aView');
  v.hidden = !audioMode; video.classList.toggle('off', audioMode); audioEl.hidden = !audioMode;
  if (!audioMode || !cur) { v.innerHTML = ''; return; }
  const ini = esc(cur.n.replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase());
  v.innerHTML = `<div class="lg">${cur.l ? `<img src="${esc(cur.l)}" alt="" referrerpolicy="no-referrer">` : `<span>${ini}</span>`}</div><b>${esc(cur.n)}</b><small>Lecture audio : continue écran verrouillé</small>`;
}
function setAudioMode(on) {
  if (audioMode === on || !cur) return;
  audioMode = on; ls.set('zap.audio', on);
  $('#ccMenu').hidden = true;
  renderAudioView();
  playUrl(curUrl || cur.u[0]);
}
const canPip = () => !!(video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode('picture-in-picture')) || !!document.pictureInPictureEnabled;
function openMore() {
  const m = $('#moreMenu');
  if (!m.hidden) { m.hidden = true; return; }
  $('#ccMenu').hidden = true;
  let h = `<button data-a="audio"><span>Écouter en arrière-plan</span>${audioMode ? '<span class="ck">✓</span>' : ''}</button>`;
  if (canPip() && !audioMode) h += '<button data-a="pip"><span>Image dans l’image</span></button>';
  h += '<p>Le mode audio coupe la vidéo : le son continue quand vous changez d’app ou verrouillez l’écran, avec les commandes sur l’écran de verrouillage.</p>';
  m.innerHTML = h; m.hidden = false;
  m.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    m.hidden = true;
    if (b.dataset.a === 'audio') setAudioMode(!audioMode);
    else if (b.dataset.a === 'pip') {
      try {
        if (video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode('picture-in-picture')) video.webkitSetPresentationMode('picture-in-picture');
        else video.requestPictureInPicture();
      } catch (e) { toast('Image dans l’image indisponible'); }
    }
  };
}
$('#pMore').onclick = e => { e.stopPropagation(); openMore(); };
document.addEventListener('click', e => { const m = $('#moreMenu'); if (!m.hidden && !m.contains(e.target)) m.hidden = true; });
if (ls.get('zap.audio', false)) { audioMode = true; }

/* ---------- divers ---------- */
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2200); }
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (!$('#player').hidden) {
    if (e.key === 'Escape') { if (!$('#ccMenu').hidden) $('#ccMenu').hidden = true; else if (!$('#moreMenu').hidden) $('#moreMenu').hidden = true; else closePlayer(); }
    else if (e.key === 'ArrowRight' && e.shiftKey) step(1);
    else if (e.key === 'ArrowLeft' && e.shiftKey) step(-1);
  } else if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
});

// Conseil d'installation sur iPhone (Safari, hors mode application)
(function () {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!ios || standalone || ls.get('zap.hint', false)) return;
  $('#hintBox').innerHTML = '<div class="hint"><span>Pour installer : touchez Partager puis « Sur l’écran d’accueil ».</span><button id="hintX">OK</button></div>';
  $('#hintX').onclick = () => { ls.set('zap.hint', true); $('#hintBox').innerHTML = ''; };
})();

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
load(false);
</script>
